    </g>
  </g>
  <text x="90" y="105" class="tiny" text-anchor="middle">query_scores</text>
</g>

<g transform="translate(830, 470)">
  <rect x="0" y="5" width="180" height="120" rx="16" fill="#8ba7ba" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="180" height="120" rx="16" fill="#ffffff" stroke="#c5d8e6" stroke-width="1.2"/>
  <g transform="translate(20, 20)">
    <g filter="url(#cardShadow)">
      <rect x="15" y="30" width="125" height="25" rx="5" fill="#e3edf4" stroke="#c9dceb" stroke-width="1.2"/>
      <line x1="25" y1="42" x2="40" y2="42" stroke="#a0bed6" stroke-width="4" stroke-linecap="round"/>

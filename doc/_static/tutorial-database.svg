<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680">

<defs>
  <linearGradient id="bggrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#f0f5fa"/>
    <stop offset="100%" stop-color="#e0eef8"/>
  </linearGradient>

  <linearGradient id="glassBox" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#eaf3f8" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="glassBoxAccent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f2fcf6" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#e0f5e8" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="boxStroke" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#55c2ff" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#2a75b3" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="boxStrokeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38e68c" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#198a51" stop-opacity="0.2"/>
  </linearGradient>

  <linearGradient id="dbBodyGrad" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0%" stop-color="#1c4463"/>
    <stop offset="30%" stop-color="#3571a5"/>
    <stop offset="70%" stop-color="#3571a5"/>
    <stop offset="100%" stop-color="#143147"/>
  </linearGradient>
  <linearGradient id="dbTopGrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#6baae0"/>
    <stop offset="100%" stop-color="#2c608c"/>
  </linearGradient>

  <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cddce8" stroke-width="0.8" opacity="0.6"/>
    <circle cx="0" cy="0" r="1.5" fill="#a9c2d6" opacity="0.5"/>
  </pattern>

  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4d6f8f" flood-opacity="0.15"/>
  </filter>
  <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3a566e" flood-opacity="0.18"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowGreen">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <style>
    .title{font:700 32px 'Inter','Segoe UI',Arial,sans-serif; fill:#112a40; letter-spacing:-0.2px}
    .label{font:800 17px 'Inter','Segoe UI',Arial,sans-serif; fill:#18364f}
    .body{font:400 14px 'Inter','Segoe UI',Arial,sans-serif; fill:#47657d}
    .small{font:600 13px 'Inter','Segoe UI',Arial,sans-serif; fill:#47657d}
    .tiny{font:600 13px 'Inter','Segoe UI',Arial,sans-serif; fill:#47657d; letter-spacing:0.2px}
    .neon-text{fill:#0099ff}
  </style>
</defs>

<rect x="0" y="0" width="1180" height="680" rx="28" fill="url(#bggrad)"/>
<rect x="12" y="12" width="1156" height="656" rx="26" fill="#ffffff" filter="url(#softshadow)"/>
<rect x="12" y="12" width="1156" height="656" rx="26" fill="url(#cyberGrid)"/>
<rect x="12" y="12" width="1156" height="656" rx="26" fill="none" stroke="#e3ebf1" stroke-width="1.5" pointer-events="none"/>

<text x="56" y="64" class="title">Store and query docking results<tspan fill="#0099ff">.</tspan></text>
<text x="56" y="96" class="body">PoseDatabase keeps normalized identifiers, serialized molecules, score payloads, and interaction rows in one SQLite file.</text>

<g fill="none" stroke-linejoin="round" stroke-linecap="round">
  <path d="M 190 230 L 280 230" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 470 200 L 525 200" stroke="#38e68c" stroke-width="2.5" filter="url(#glowGreen)"/>
  
  <path d="M 765 170 L 825 170" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)"/>
  <!-- <path d="M 765 240 C 790 240, 790 300, 825 300" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)"/> -->
  
  <path d="M 645 295 L 645 420" stroke="#706fd3" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 645 420 L 370 420 L 370 470" stroke="#706fd3" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 645 420 L 646 470 L 646 470" stroke="#706fd3" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 645 420 L 900 420 L 900 470" stroke="#706fd3" stroke-width="2.5" filter="url(#glow)"/>
</g>

<g stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <g transform="translate(260, 220)" stroke="#00f0ff"><path d="M 0 0 L 8 10 L 0 20" filter="url(#glow)"/></g>
  <g transform="translate(505, 190)" stroke="#38e68c"><path d="M 0 0 L 8 10 L 0 20" filter="url(#glowGreen)"/></g>
  <g transform="translate(805, 160)" stroke="#00f0ff"><path d="M 0 0 L 8 10 L 0 20" filter="url(#glow)"/></g>
  <g transform="translate(805, 290)" stroke="#00f0ff"><path d="M 0 0 L 8 10 L 0 20" filter="url(#glow)"/></g>
  
  <!-- <g transform="translate(362, 463)" stroke="#00f0ff"><path d="M 0 0 L 10 8 L 20 0" filter="url(#glow)"/></g>
  <g transform="translate(637, 463)" stroke="#00f0ff"><path d="M 0 0 L 10 8 L 20 0" filter="url(#glow)"/></g>
  <g transform="translate(890, 463)" stroke="#00f0ff"><path d="M 0 0 L 10 8 L 20 0" filter="url(#glow)"/></g> -->
</g>
<g transform="translate(90, 160) scale(0.9)">
  <ellipse cx="80" cy="160" rx="100" ry="30" fill="#0b1b29" opacity="0.25" filter="url(#softshadow)"/>
  <path d="M -10,25 L -10,160 A 90 25 0 0 0 170,160 L 170,25 Z" fill="url(#dbBodyGrad)" filter="url(#softshadow)"/>
  <path d="M -10,65 A 90 25 0 0 0 170,65" fill="none" stroke="#163954" stroke-width="3"/>
  <path d="M -10,65 A 90 25 0 0 0 170,65" fill="none" stroke="#4886b8" stroke-width="1" opacity="0.5" transform="translate(0,-1)"/>
  <path d="M -10,105 A 90 25 0 0 0 170,105" fill="none" stroke="#163954" stroke-width="3"/>
  <path d="M -10,105 A 90 25 0 0 0 170,105" fill="none" stroke="#4886b8" stroke-width="1" opacity="0.5" transform="translate(0,-1)"/>
  <rect x="20" y="50" width="10" height="3" fill="#4df08d" rx="1.5" filter="url(#glow)"/>
  <rect x="35" y="50" width="3" height="3" fill="#4df08d" rx="1.5"/>
  <rect x="20" y="90" width="10" height="3" fill="#4df08d" rx="1.5" filter="url(#glow)"/>
  <rect x="35" y="90" width="3" height="3" fill="#f04d4d" rx="1.5" filter="url(#glow)"/>
  <rect x="20" y="130" width="10" height="3" fill="#4df08d" rx="1.5" filter="url(#glow)"/>
  <rect x="35" y="130" width="3" height="3" fill="#4df08d" rx="1.5"/>
  <ellipse cx="80" cy="25" rx="90" ry="25" fill="url(#dbTopGrad)" stroke="#81c1f2" stroke-width="2"/>
  <ellipse cx="80" cy="25" rx="75" ry="18" fill="none" stroke="#e8f5fc" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="80" cy="25" rx="55" ry="12" fill="none" stroke="#a9d6f5" stroke-width="0.8" opacity="0.4"/>
  <text x="80.0" y="215" class="small" text-anchor="middle">SQLite database</text>
</g>

<g transform="translate(280, 140)">
  <rect x="0" y="6" width="190" height="150" rx="20" fill="#a4c2d6" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="190" height="150" rx="20" fill="url(#glassBox)" stroke="url(#boxStroke)" stroke-width="1.5"/>
  <path d="M 0 45 L 190 45" stroke="#c9dceb" stroke-width="1.5"/>
  <rect x="15" y="15" width="20" height="4" rx="2" fill="#00f0ff" filter="url(#glow)"/>
  <text x="95" y="30" class="label" text-anchor="middle">catalogs</text>
  <circle cx="20" cy="65" r="3" fill="#0099ff"/>
  <text x="35" y="70" class="tiny">receptors</text>
  <circle cx="20" cy="95" r="3" fill="#0099ff"/>
  <text x="35" y="100" class="tiny">ligands</text>
  <circle cx="20" cy="125" r="3" fill="#0099ff"/>
  <text x="35" y="130" class="tiny">engines</text>
</g>

<g transform="translate(525, 120)">

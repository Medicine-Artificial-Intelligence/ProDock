  <path d="M 0 45 L 200 45" stroke="#c9dceb" stroke-width="1.5"/>
  <rect x="15" y="15" width="20" height="4" rx="2" fill="#00f0ff" filter="url(#glow)"/>
  <text x="100" y="30" class="label" text-anchor="middle">scores</text>
  <circle cx="20" cy="65" r="3" fill="#0099ff"/>
  <text x="35" y="70" class="tiny">affinity</text>
  <circle cx="20" cy="95" r="3" fill="#0099ff"/>
  <text x="35" y="100" class="tiny">score_json</text>
</g>

<g transform="translate(825, 240)">
  <rect x="0" y="6" width="200" height="140" rx="20" fill="#a4c2d6" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="200" height="140" rx="20" fill="url(#glassBox)" stroke="url(#boxStroke)" stroke-width="1.5"/>
  <path d="M 0 45 L 200 45" stroke="#c9dceb" stroke-width="1.5"/>
  <rect x="15" y="15" width="20" height="4" rx="2" fill="#00f0ff" filter="url(#glow)"/>
  <text x="100" y="30" class="label" text-anchor="middle">interactions</text>
  <circle cx="20" cy="65" r="3" fill="#0099ff"/>
  <text x="35" y="70" class="tiny">interaction_type</text>
  <circle cx="20" cy="95" r="3" fill="#0099ff"/>
  <text x="35" y="100" class="tiny">residue_id</text>
  <circle cx="20" cy="125" r="3" fill="#0099ff"/>
  <text x="35" y="130" class="tiny">distance / angle</text>
</g>



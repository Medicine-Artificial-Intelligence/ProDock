<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">

<defs>
  <linearGradient id="bggrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#fbfdff"/>
    <stop offset="100%" stop-color="#f4f8fb"/>
  </linearGradient>
  <linearGradient id="navygrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#376789"/>
    <stop offset="100%" stop-color="#1f425f"/>
  </linearGradient>
  <linearGradient id="bluegrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#9cc6df"/>
    <stop offset="100%" stop-color="#4f87b0"/>
  </linearGradient>
  <linearGradient id="dbgrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#8fc3e2"/>
    <stop offset="55%" stop-color="#3571a5"/>
    <stop offset="100%" stop-color="#214f76"/>
  </linearGradient>

  <linearGradient id="dbBodyGrad" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0%" stop-color="#1c4463"/>
    <stop offset="30%" stop-color="#3571a5"/>
    <stop offset="70%" stop-color="#3571a5"/>
    <stop offset="100%" stop-color="#143147"/>
  </linearGradient>
  <linearGradient id="dbTopGrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#6baae0"/>
    <stop offset="100%" stop-color="#2c608c"/>
  </linearGradient>
  
  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c92a6" flood-opacity="0.12"/>
  </filter>
  <filter id="innershadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#afbfcc" flood-opacity="0.10"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
    <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="blocky3D" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="-2.5" dy="3.5" stdDeviation="0" flood-color="#1a364f" flood-opacity="0.4"/>
    <feDropShadow dx="-1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2"/>
  </filter>
  <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3a566e" flood-opacity="0.18"/>
  </filter>
  
  <radialGradient id="sphereYellow" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#ffebb3"/>
    <stop offset="40%" stop-color="#f4b93b"/>
    <stop offset="85%" stop-color="#c98d06"/>
    <stop offset="100%" stop-color="#8a5f00"/>
  </radialGradient>
  <radialGradient id="sphereRed" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#ffc2b3"/>
    <stop offset="40%" stop-color="#f24d3d"/>
    <stop offset="85%" stop-color="#bd2111"/>
    <stop offset="100%" stop-color="#7a1005"/>
  </radialGradient>
  <radialGradient id="sphereBlue" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#d4f1fa"/>
    <stop offset="40%" stop-color="#57b8d9"/>
    <stop offset="85%" stop-color="#2a86a6"/>
    <stop offset="100%" stop-color="#14546b"/>
  </radialGradient>
  <radialGradient id="sphereOrange" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#ffd1c2"/>
    <stop offset="40%" stop-color="#ef6a48"/>
    <stop offset="85%" stop-color="#b83614"/>
    <stop offset="100%" stop-color="#751e08"/>
  </radialGradient>
  <filter id="atomShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="1.5" dy="4" stdDeviation="2.5" flood-color="#051421" flood-opacity="0.5"/>
  </filter>

  <style>
    .title{font:700 32px 'Inter','Segoe UI',Arial,sans-serif; fill:#1f3f59; letter-spacing:-0.2px}
    .subtitle{font:600 18px 'Inter','Segoe UI',Arial,sans-serif; fill:#4274a0}
    .label{font:700 17px 'Inter','Segoe UI',Arial,sans-serif; fill:#23445f}
    .body{font:400 14px 'Inter','Segoe UI',Arial,sans-serif; fill:#526b7d}
    .small{font:600 13px 'Inter','Segoe UI',Arial,sans-serif; fill:#526b7d}
    .tiny{font:600 11.5px 'Inter','Segoe UI',Arial,sans-serif; fill:#6a7e8c; letter-spacing:0.1px}
  </style>
</defs>

<rect x="0" y="0" width="1200" height="700" rx="28" fill="url(#bggrad)"/>
<rect x="12" y="12" width="1176" height="676" rx="26" fill="#ffffff" stroke="#e3ebf1" stroke-width="1.5" filter="url(#softshadow)"/>

<text x="60" y="68" class="title">From raw structures to reusable docking data</text>
<rect x="1034" y="40" width="118" height="34" rx="17" fill="#EAF3F8" stroke="#d6e0e8" stroke-width="1.2" filter="url(#innershadow)"/>
<text x="1093.0" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#315f86" text-anchor="middle">Tutorial</text>
<text x="60" y="100" class="body">Tutorial pages mirror the package layout and keep each stage focused.</text>

<g transform="translate(50,150)">
  <rect x="0" y="0" width="180" height="120" rx="22" fill="#ffffff" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
  <text x="22" y="35" class="label">1 · Structure</text>
  <text x="22" y="62" class="body"><tspan x="22" dy="0">query PDB · keep chains</tspan><tspan x="22" dy="20">· extract bound ligand</tspan></text>
  
  <rect x="205" y="0" width="190" height="120" rx="22" fill="#ffffff" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
  <text x="227" y="35" class="label">2 · Preprocess</text>
  <text x="227" y="62" class="body"><tspan x="227" dy="0">prepare receptor / ligands</tspan><tspan x="227" dy="20">· compute box</tspan></text>
  
  <rect x="420" y="-8" width="195" height="136" rx="22" fill="#eef5ed" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
  <text x="442" y="27" class="label">3 · Dock</text>
  <text x="442" y="54" class="body"><tspan x="442" dy="0">single, batch, or</tspan><tspan x="442" dy="20">matrix campaigns</tspan></text>
  
  <rect x="640" y="0" width="190" height="120" rx="22" fill="#ffffff" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
  <text x="662" y="35" class="label">4 · Postprocess</text>
  <text x="662" y="62" class="body"><tspan x="662" dy="0">scores · poses</tspan><tspan x="662" dy="20">· interactions · metrics</tspan></text>
  
  <rect x="855" y="0" width="185" height="120" rx="22" fill="#ffffff" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
  <text x="877" y="35" class="label">5 · Database</text>
  <text x="877" y="62" class="body"><tspan x="877" dy="0">store poses, scores,</tspan><tspan x="877" dy="20">interactions</tspan></text>
  
  <polygon points="185.0,64.0 185.0,69.6 203.0,60.0 185.0,50.4 185.0,56.0" fill="#567d9c" opacity="0.92"/>
  <polygon points="400.0,69.6 418.0,60.0 400.0,50.4 400.0,56.0" fill="#567d9c" opacity="0.92"/>
  <polygon points="620.0,64.0 620.0,69.6 638.0,60.0 620.0,50.4 620.0,56.0" fill="#567d9c" opacity="0.92"/>
  <polygon points="835.0,64.0 835.0,69.6 853.0,60.0 835.0,50.4 835.0,56.0" fill="#567d9c" opacity="0.92"/>
  
  <rect x="440" y="142" width="160" height="30" rx="15.0" fill="#edf5fa"/>
  <text x="520.0" y="162.0" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#23445f" text-anchor="middle">multi-engine registry</text>
  <rect x="0" y="142" width="176" height="30" rx="15.0" fill="#f1f7f0"/>
  <text x="88.0" y="162.0" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#23445f" text-anchor="middle">reference ligand driven</text>
  <rect x="850" y="142" width="190" height="30" rx="15.0" fill="#f8f4ec"/>
  <text x="945.0" y="162.0" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#23445f" text-anchor="middle">query once, analyze many</text>
</g>
  

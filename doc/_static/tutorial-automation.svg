<rect x="415" y="250" width="260" height="180" rx="22" fill="#ffffff" stroke="#d8e3ea" stroke-width="2" /><text x="437" y="285" class="label">ProDockPipeline</text><text x="437" y="312" class="body">prepare_receptors · prepare_ligands · build_campaign · run</text>

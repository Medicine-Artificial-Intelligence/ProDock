  <rect x="0" y="0" width="250" height="140" rx="22" fill="url(#glassBoxBlue)" stroke="url(#boxStroke)" stroke-width="1.5"/>
  <text x="25" y="35" class="label">LIGANDS</text>
  <rect x="15" y="15" width="4" height="25" rx="2" fill="#00f0ff" filter="url(#glow)"/>
  

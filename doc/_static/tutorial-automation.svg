<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="680" viewBox="0 0 1220 680">

<defs>
  <linearGradient id="bggrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#fbfdff"/>
    <stop offset="100%" stop-color="#f4f8fb"/>
  </linearGradient>
  <linearGradient id="bluegrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#9cc6df"/>
    <stop offset="100%" stop-color="#4f87b0"/>
  </linearGradient>
  <linearGradient id="navygrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#376789"/>
    <stop offset="100%" stop-color="#1f425f"/>
  </linearGradient>
  <linearGradient id="ambergrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#efcb84"/>
    <stop offset="100%" stop-color="#bf8b35"/>
  </linearGradient>
  <linearGradient id="sagegrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#b7ccb2"/>
    <stop offset="100%" stop-color="#6f8969"/>
  </linearGradient>
  <linearGradient id="stonegrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#d7c7af"/>
    <stop offset="100%" stop-color="#8f7758"/>
  </linearGradient>
  <linearGradient id="dbgrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#8fc3e2"/>
    <stop offset="55%" stop-color="#3571a5"/>
    <stop offset="100%" stop-color="#214f76"/>
  </linearGradient>
  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c92a6" flood-opacity="0.12"/>
  </filter>
  <filter id="innershadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#afbfcc" flood-opacity="0.10"/>
  </filter>
  <style>
    .title{font:700 32px 'Inter','Segoe UI',Arial,sans-serif; fill:#1f3f59; letter-spacing:-0.2px}
    .subtitle{font:600 18px 'Inter','Segoe UI',Arial,sans-serif; fill:#4274a0}
    .label{font:700 17px 'Inter','Segoe UI',Arial,sans-serif; fill:#23445f}
    .body{font:400 14px 'Inter','Segoe UI',Arial,sans-serif; fill:#526b7d}
    .small{font:600 13px 'Inter','Segoe UI',Arial,sans-serif; fill:#526b7d}
    .tiny{font:600 11.5px 'Inter','Segoe UI',Arial,sans-serif; fill:#6a7e8c; letter-spacing:0.1px}
  </style>
</defs>

<rect x="0" y="0" width="1220" height="680" rx="28" fill="url(#bggrad)"/>
<rect x="12" y="12" width="1196" height="656" rx="26" fill="#ffffff" stroke="#e3ebf1" stroke-width="1.5" filter="url(#softshadow)"/>

<text x="56" y="64" class="title">Automation with ProDockPipeline</text>
<text x="56" y="96" class="body">Supply receptor dictionaries and ligand dictionaries, then let the pipeline prepare inputs, build a campaign, and run batch docking.</text>
<rect x="80" y="170" width="245" height="180" rx="22" fill="#f1f7f0" stroke="#d6e0e8" stroke-width="2"  filter="url(#softshadow)"/><text x="102" y="205" class="label">RECEPTORS</text>
<text x="102" y="232" class="body">
  <tspan x="102" dy="0"> pdb_id · receptor_name </tspan>
  <tspan x="102" dy="20"> ligand_code · chains · cofactors </tspan>
</text>
<rect x="80" y="390" width="245" height="140" rx="22" fill="#edf5fa" stroke="#d6e0e8" stroke-width="2"  filter="url(#softshadow)"/><text x="102" y="425" class="label">LIGANDS</text><text x="102" y="452" class="body">id · smiles</text>
<rect x="415" y="250" width="260" height="180" rx="22" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"  filter="url(#softshadow)"/><text x="437" y="285" class="label">ProDockPipeline</text>
<text x="437" y="312" class="body">
  <tspan x="437" dy="0"> prepare_receptors · prepare_ligands </tspan>
  <tspan x="437" dy="20"> build_campaign · run</tspan>
</text>
<rect x="770" y="170" width="170" height="110" rx="22" fill="#f8f4ec" stroke="#d6e0e8" stroke-width="2"  filter="url(#softshadow)"/><text x="792" y="205" class="label">campaign.json</text><text x="792" y="232" class="body">matrix tasks</text>
<rect x="770" y="330" width="170" height="110" rx="22" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"  filter="url(#softshadow)"/><text x="792" y="365" class="label">BatchDock</text><text x="792" y="392" class="body">parallel execution</text>
<rect x="770" y="520" width="170" height="110" rx="22" fill="#f1f7f0" stroke="#d6e0e8" stroke-width="2"  filter="url(#softshadow)"/><text x="792" y="555" class="label">Results</text><text x="792" y="582" class="body">files + summaries</text>

<text x="56" y="64" class="title">Automation with ProDockPipeline</text>
<text x="56" y="96" class="body">Supply receptor dictionaries and ligand dictionaries, then let the pipeline prepare inputs, build a campaign, and run batch docking.</text>
<rect x="80" y="170" width="245" height="180" rx="22" fill="#EEF5ED" stroke="#d8e3ea" stroke-width="2" /><text x="102" y="205" class="label">RECEPTORS</text><text x="102" y="232" class="body">pdb_id · receptor_name · ligand_code · chains · cofactors</text>

<text x="56" y="64" class="title">Dock with single, batch, or matrix workflows</text>
<text x="56" y="96" class="body">ProDock builds tasks from receptors, ligands, and engines, then executes them through a registry-backed docking layer.</text>
<rect x="80" y="180" width="180" height="110" rx="22" fill="#EEF5ED" stroke="#d8e3ea" stroke-width="2" /><text x="102" y="215" class="label">Receptors</text><text x="102" y="242" class="body">prepared receptor set</text>
<rect x="80" y="330" width="180" height="110" rx="22" fill="#EAF3F8" stroke="#d8e3ea" stroke-width="2" /><text x="102" y="365" class="label">Ligands</text><text x="102" y="392" class="body">prepared ligand set</text>
<rect x="80" y="480" width="180" height="110" rx="22" fill="#F6F1E7" stroke="#d8e3ea" stroke-width="2" /><text x="102" y="515" class="label">Engines</text><text x="102" y="542" class="body">vina · smina · gnina · qvina</text>
<rect x="350" y="285" width="250" height="170" rx="22" fill="#ffffff" stroke="#d8e3ea" stroke-width="2" /><text x="372" y="320" class="label">BatchDock / MatrixDock</text><text x="372" y="347" class="body">task expansion · parallel execution · progress</text>
<rect x="700" y="180" width="170" height="110" rx="22" fill="#ffffff" stroke="#d8e3ea" stroke-width="2" /><text x="722" y="215" class="label">SingleDock</text><text x="722" y="242" class="body">one task</text>
<rect x="700" y="330" width="170" height="110" rx="22" fill="#ffffff" stroke="#d8e3ea" stroke-width="2" /><text x="722" y="365" class="label">Registry</text><text x="722" y="392" class="body">engine factory</text>
<rect x="700" y="480" width="170" height="110" rx="22" fill="#ffffff" stroke="#d8e3ea" stroke-width="2" /><text x="722" y="515" class="label">Campaign</text><text x="722" y="542" class="body">json / config driven</text>
<rect x="965" y="285" width="180" height="170" rx="22" fill="#EEF5ED" stroke="#d8e3ea" stroke-width="2" /><text x="987" y="320" class="label">Outputs</text><text x="987" y="347" class="body">pose files · logs · scores</text>

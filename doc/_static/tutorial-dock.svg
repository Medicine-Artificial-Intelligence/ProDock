<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">

<defs>
  <linearGradient id="bggrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#f0f5fa"/>
    <stop offset="100%" stop-color="#e0eef8"/>
  </linearGradient>

  <linearGradient id="glassBox" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#eaf3f8" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="glassBoxAccent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f2fcf6" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#e0f5e8" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="boxStroke" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#55c2ff" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#2a75b3" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="boxStrokeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38e68c" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#198a51" stop-opacity="0.2"/>
  </linearGradient>

  <linearGradient id="pillTop" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#e2eef7"/>
  </linearGradient>
  <linearGradient id="pillSide" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#92bcdc"/>
    <stop offset="100%" stop-color="#5a8bac"/>
  </linearGradient>

  <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cddce8" stroke-width="0.8" opacity="0.6"/>
    <circle cx="0" cy="0" r="1.5" fill="#a9c2d6" opacity="0.5"/>
  </pattern>

  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4d6f8f" flood-opacity="0.15"/>
  </filter>
  <filter id="innershadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#afbfcc" flood-opacity="0.10"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowGreen">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowGold">
    <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="blocky3D" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="-2" dy="3" stdDeviation="0.5" flood-color="#1a364f" flood-opacity="0.3"/>
    <feDropShadow dx="-0.5" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.15"/>
  </filter>
  <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3a566e" flood-opacity="0.18"/>
  </filter>

  <style>
    .title{font:700 32px 'Inter','Segoe UI',Arial,sans-serif; fill:#112a40; letter-spacing:-0.2px}
    .label{font:800 17px 'Inter','Segoe UI',Arial,sans-serif; fill:#18364f}
    .body{font:400 14px 'Inter','Segoe UI',Arial,sans-serif; fill:#47657d}
    .small{font:600 13px 'Inter','Segoe UI',Arial,sans-serif; fill:#47657d}
    .tiny{font:600 12px 'Inter','Segoe UI',Arial,sans-serif; fill:#6a7e8c; letter-spacing:0.1px}
    .neon-text{fill:#0099ff}
    .cyber-dot{fill:#00f0ff}
  </style>
</defs>

<rect x="0" y="0" width="1200" height="690" rx="28" fill="url(#bggrad)"/>
<rect x="12" y="12" width="1176" height="666" rx="26" fill="#ffffff" filter="url(#softshadow)"/>
<rect x="12" y="12" width="1176" height="666" rx="26" fill="url(#cyberGrid)"/>
<rect x="12" y="12" width="1176" height="666" rx="26" fill="none" stroke="#e3ebf1" stroke-width="1.5" pointer-events="none"/>

<text x="56" y="64" class="title">Dock with single, batch, or matrix workflows</text>
<g transform="translate(1034, 35)">
  <rect x="0" y="3" width="118" height="34" rx="17" fill="url(#pillSide)" filter="url(#innershadow)"/>
  <rect x="0" y="0" width="118" height="34" rx="17" fill="url(#pillTop)"/>
  <circle cx="18" cy="17" r="4.5" class="cyber-dot" filter="url(#glow)"/>
  <text x="66" y="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#315f86" text-anchor="middle">Execution</text>
</g>
<text x="56" y="96" class="body">ProDock builds tasks from receptors, ligands, and engines, then executes them through a registry-backed docking layer.</text>


<g fill="none" stroke-linejoin="round" stroke-linecap="round">
  <path d="M 270 215 C 330 215, 300 365, 370 365" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>
  <path d="M 270 365 L 370 365 L 370 370" stroke="#38e68c" stroke-width="3" filter="url(#glowGreen)"/>
  <path d="M 270 515 C 330 515, 300 365, 370 365" stroke="#f4b93b" stroke-width="3" filter="url(#glowGold)"/>

  <path d="M 630 365 C 680 365, 660 215, 710 215" stroke="#38e68c" stroke-width="3" filter="url(#glowGreen)"/>
  <path d="M 630 365 L 710 365" stroke="#38e68c" stroke-width="3" filter="url(#glowGreen)"/>
  <path d="M 630 365 C 680 365, 660 515, 710 515" stroke="#38e68c" stroke-width="3" filter="url(#glowGreen)"/>

  <path d="M 930 215 C 980 215, 960 365, 1010 365" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>
  <path d="M 930 365 L 1010 365 L 1010 370" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>
  <path d="M 930 515 C 980 515, 960 365, 1010 365" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>
</g>


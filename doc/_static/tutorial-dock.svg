<g transform="translate(50, 160)">
  <rect x="0" y="6" width="220" height="110" rx="20" fill="#a4c2d6" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="220" height="110" rx="20" fill="url(#glassBox)" stroke="url(#boxStroke)" stroke-width="1.5"/>
  <rect x="15" y="15" width="4" height="25" rx="2" fill="#00f0ff" filter="url(#glow)"/>
  <text x="32" y="33" class="label">Receptors</text>
  <circle cx="32" cy="65" r="4" fill="#0099ff"/>
  <text x="45" y="70" class="body">prepared receptor set</text>
</g>

<g transform="translate(50, 310)">
  <rect x="0" y="6" width="220" height="110" rx="20" fill="#a4c2d6" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="220" height="110" rx="20" fill="url(#glassBox)" stroke="url(#boxStroke)" stroke-width="1.5"/>
  <rect x="15" y="15" width="4" height="25" rx="2" fill="#38e68c" filter="url(#glowGreen)"/>
  <text x="32" y="33" class="label">Ligands</text>
  <circle cx="32" cy="65" r="4" fill="#10b968"/>
  <text x="45" y="70" class="body">prepared ligand set</text>
</g>

<g transform="translate(50, 460)">
  <rect x="0" y="6" width="220" height="110" rx="20" fill="#a4c2d6" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="220" height="110" rx="20" fill="url(#glassBox)" stroke="url(#boxStroke)" stroke-width="1.5"/>
  <rect x="15" y="15" width="4" height="25" rx="2" fill="#f4b93b" filter="url(#glowGold)"/>
  <text x="32" y="33" class="label">Engines</text>
  <circle cx="32" cy="65" r="4" fill="#d49e28"/>
  <text x="45" y="70" class="body">vina · smina</text>
  <circle cx="32" cy="85" r="4" fill="#d49e28"/>
  <text x="45" y="90" class="body">gnina · qvina</text>
</g>


<g transform="translate(370, 270)">
  <rect x="0" y="8" width="260" height="190" rx="24" fill="#8cbfa2" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="260" height="190" rx="24" fill="url(#glassBoxAccent)" stroke="url(#boxStrokeGreen)" stroke-width="2"/>
  <rect x="20" y="20" width="30" height="5" rx="2.5" fill="#38e68c" filter="url(#glowGreen)"/>
  <text x="20" y="55" class="label">BatchDock / MatrixDock</text>
  <text x="20" y="85" class="body">task expansion · progress</text>
  <text x="20" y="105" class="body">parallel execution</text>

  <g transform="translate(130, 120) scale(1.1)" filter="url(#blocky3D)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#a8d6be" stroke-width="1.5"/>
    <line x1="0" y1="25" x2="80" y2="25" stroke="#a8d6be" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="80" y2="50" stroke="#a8d6be" stroke-width="1.5"/>
    
    <line x1="0" y1="0" x2="0" y2="50" stroke="#a8d6be" stroke-width="1.5"/>
    <line x1="40" y1="0" x2="40" y2="50" stroke="#a8d6be" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="80" y2="50" stroke="#a8d6be" stroke-width="1.5"/>

    <rect x="-4" y="-4" width="8" height="8" rx="2" fill="#10b968"/>
    <rect x="36" y="-4" width="8" height="8" rx="2" fill="#eaf3f8"/>
    <rect x="76" y="-4" width="8" height="8" rx="2" fill="#eaf3f8"/>

    <rect x="-4" y="21" width="8" height="8" rx="2" fill="#eaf3f8"/>
    <rect x="36" y="21" width="8" height="8" rx="2" fill="#38e68c" filter="url(#glowGreen)"/>
    <rect x="76" y="21" width="8" height="8" rx="2" fill="#eaf3f8"/>

    <rect x="-4" y="46" width="8" height="8" rx="2" fill="#eaf3f8"/>
    <rect x="36" y="46" width="8" height="8" rx="2" fill="#eaf3f8"/>
    <rect x="76" y="46" width="8" height="8" rx="2" fill="#10b968"/>
  </g>
</g>


<g transform="translate(710, 160)">
  <rect x="0" y="6" width="220" height="110" rx="20" fill="#a4c2d6" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="220" height="110" rx="20" fill="url(#glassBox)" stroke="url(#boxStroke)" stroke-width="1.5"/>
  <rect x="15" y="15" width="20" height="4" rx="2" fill="#00f0ff" filter="url(#glow)"/>
  <text x="45" y="21" class="label">SingleDock</text>
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="none" stroke="#0099ff" stroke-width="2"/>
    <circle cx="15" cy="15" r="5" fill="#00f0ff" filter="url(#glow)"/>
  </g>
  <text x="65" y="70" class="body">one mapped task</text>
</g>

<g transform="translate(710, 310)">
  <rect x="0" y="6" width="220" height="110" rx="20" fill="#a4c2d6" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="220" height="110" rx="20" fill="url(#glassBox)" stroke="url(#boxStroke)" stroke-width="1.5"/>
  <rect x="15" y="15" width="20" height="4" rx="2" fill="#00f0ff" filter="url(#glow)"/>
  <text x="45" y="21" class="label">Registry</text>
  <g transform="translate(20, 50)">
    <path d="M 0 10 L 10 0 L 30 0 L 30 30 L 0 30 Z" fill="none" stroke="#0099ff" stroke-width="2"/>
    <line x1="10" y1="15" x2="20" y2="15" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <line x1="10" y1="22" x2="20" y2="22" stroke="#0099ff" stroke-width="2"/>
  </g>
  <text x="65" y="70" class="body">engine factory</text>
</g>

<g transform="translate(710, 460)">
  <rect x="0" y="6" width="220" height="110" rx="20" fill="#a4c2d6" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="220" height="110" rx="20" fill="url(#glassBox)" stroke="url(#boxStroke)" stroke-width="1.5"/>
  <rect x="15" y="15" width="20" height="4" rx="2" fill="#00f0ff" filter="url(#glow)"/>
  <text x="45" y="21" class="label">Campaign</text>
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="30" height="30" rx="4" fill="none" stroke="#0099ff" stroke-width="2"/>
    <text x="15" y="20" font-family="monospace" font-size="16" font-weight="bold" fill="#00f0ff" text-anchor="middle" filter="url(#glow)">{}</text>
  </g>
  <text x="65" y="62" class="body">json / config driven</text>
  <text x="65" y="82" class="body">experiment tracking</text>
</g>


<g transform="translate(1010, 270)">
  <rect x="0" y="8" width="150" height="190" rx="20" fill="#8ba7ba" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="150" height="190" rx="20" fill="#ffffff" stroke="#c5d8e6" stroke-width="2"/>
  
  <text x="70" y="35" class="label" text-anchor="middle">Outputs</text>
  
  <g transform="translate(27, 55)">
    <g filter="url(#cardShadow)">
      <rect x="10" y="40" width="90" height="40" rx="6" fill="#e3edf4" stroke="#c9dceb" stroke-width="1.2"/>
      <circle cx="25" cy="60" r="4" fill="#0099ff"/>
      <line x1="35" y1="60" x2="85" y2="60" stroke="#a0bed6" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g filter="url(#cardShadow)">
      <rect x="5" y="20" width="90" height="40" rx="6" fill="#f0f6fa" stroke="#c9dceb" stroke-width="1.2"/>
      <circle cx="20" cy="40" r="4" fill="#10b968"/>
      <line x1="30" y1="36" x2="80" y2="36" stroke="#7a9db8" stroke-width="4" stroke-linecap="round"/>
      <line x1="30" y1="44" x2="60" y2="44" stroke="#7a9db8" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g filter="url(#cardShadow)">
      <rect x="0" y="0" width="90" height="40" rx="6" fill="#ffffff" stroke="#b1cbe0" stroke-width="1.2"/>
      <circle cx="15" cy="20" r="4" fill="#00f0ff" filter="url(#glow)"/>
      <line x1="25" y1="20" x2="75" y2="20" stroke="#3f76a3" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  
  <text x="75" y="160" class="tiny" text-anchor="middle">pose files · logs · scores</text>
  <!-- <text x="70" y="175" class="tiny" text-anchor="middle">scores</text> -->
</g>

</svg>

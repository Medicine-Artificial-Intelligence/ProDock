<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">

<defs>
  <linearGradient id="bggrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#fbfdff"/>
    <stop offset="100%" stop-color="#f4f8fb"/>
  </linearGradient>
  <linearGradient id="bluegrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#9cc6df"/>
    <stop offset="100%" stop-color="#4f87b0"/>
  </linearGradient>
  <linearGradient id="navygrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#376789"/>
    <stop offset="100%" stop-color="#1f425f"/>
  </linearGradient>
  <linearGradient id="ambergrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#efcb84"/>
    <stop offset="100%" stop-color="#bf8b35"/>
  </linearGradient>
  <linearGradient id="sagegrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#b7ccb2"/>
    <stop offset="100%" stop-color="#6f8969"/>
  </linearGradient>
  <linearGradient id="stonegrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#d7c7af"/>
    <stop offset="100%" stop-color="#8f7758"/>
  </linearGradient>
  <linearGradient id="dbgrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#8fc3e2"/>
    <stop offset="55%" stop-color="#3571a5"/>
    <stop offset="100%" stop-color="#214f76"/>
  </linearGradient>
  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c92a6" flood-opacity="0.12"/>
  </filter>
  <filter id="innershadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#afbfcc" flood-opacity="0.10"/>
  </filter>
  
  <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
    <polygon points="0,0 16,8 0,16" fill="#3f76a3" opacity="0.95"/>
  </marker>
  <marker id="arrow-gold" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
    <polygon points="0,0 16,8 0,16" fill="#8a7658" opacity="0.92"/>
  </marker>
  
  <style>
    .title{font:700 32px 'Inter','Segoe UI',Arial,sans-serif; fill:#1f3f59; letter-spacing:-0.2px}
    .subtitle{font:600 18px 'Inter','Segoe UI',Arial,sans-serif; fill:#4274a0}
    .label{font:700 17px 'Inter','Segoe UI',Arial,sans-serif; fill:#23445f}
    .body{font:400 14px 'Inter','Segoe UI',Arial,sans-serif; fill:#526b7d}
    .small{font:600 13px 'Inter','Segoe UI',Arial,sans-serif; fill:#526b7d}
    .tiny{font:600 11.5px 'Inter','Segoe UI',Arial,sans-serif; fill:#6a7e8c; letter-spacing:0.1px}
  </style>
</defs>

<rect x="0" y="0" width="1200" height="690" rx="28" fill="url(#bggrad)"/>
<rect x="12" y="12" width="1176" height="666" rx="26" fill="#ffffff" stroke="#e3ebf1" stroke-width="1.5" filter="url(#softshadow)"/>

<text x="56" y="64" class="title">Dock with single, batch, or matrix workflows</text>
<text x="56" y="96" class="body">ProDock builds tasks from receptors, ligands, and engines, then executes them through a registry-backed docking layer.</text>

<rect x="35" y="180" width="210" height="110" rx="22" fill="#f1f7f0" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
<text x="57" y="215" class="label">Receptors</text>
<text x="57" y="242" class="body">prepared receptor set</text>

<rect x="35" y="330" width="210" height="110" rx="22" fill="#edf5fa" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
<text x="57" y="365" class="label">Ligands</text>
<text x="57" y="392" class="body">prepared ligand set</text>

<rect x="35" y="480" width="210" height="110" rx="22" fill="#f8f4ec" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
<text x="57" y="515" class="label">Engines</text>
<text x="57" y="542" class="body">vina · smina · gnina · qvina</text>

<rect x="290" y="285" width="320" height="170" rx="22" fill="#ffffff" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
<text x="312" y="320" class="label">BatchDock / MatrixDock</text>
<text x="312" y="347" class="body">task expansion · parallel execution · progress</text>

<rect x="715" y="180" width="190" height="110" rx="22" fill="#ffffff" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
<text x="737" y="215" class="label">SingleDock</text>
<text x="737" y="242" class="body">one task</text>

<rect x="715" y="330" width="190" height="110" rx="22" fill="#ffffff" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
<text x="737" y="365" class="label">Registry</text>
<text x="737" y="392" class="body">engine factory</text>

<rect x="715" y="480" width="190" height="110" rx="22" fill="#ffffff" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
<text x="737" y="515" class="label">Campaign</text>
<text x="737" y="542" class="body">json / config driven</text>

<rect x="950" y="285" width="210" height="170" rx="22" fill="#f1f7f0" stroke="#d6e0e8" stroke-width="2" filter="url(#softshadow)"/>
<text x="972" y="320" class="label">Outputs</text>
<text x="972" y="347" class="body">pose files · logs · scores</text>

<line x1="245" y1="265" x2="285" y2="320" stroke="#3f76a3" stroke-width="6" opacity="0.95" marker-end="url(#arrow-blue)"/>
<line x1="245" y1="370" x2="285" y2="370" stroke="#3f76a3" stroke-width="6" opacity="0.95" marker-end="url(#arrow-blue)"/>
<line x1="250" y1="510" x2="285" y2="420" stroke="#3f76a3" stroke-width="6" opacity="0.95" marker-end="url(#arrow-blue)"/>

<line x1="610" y1="320" x2="710" y2="265" stroke="#8a7658" stroke-width="6" opacity="0.92" marker-end="url(#arrow-gold)"/>
<line x1="610" y1="370" x2="710" y2="370" stroke="#8a7658" stroke-width="6" opacity="0.92" marker-end="url(#arrow-gold)"/>
<line x1="610" y1="420" x2="710" y2="505" stroke="#8a7658" stroke-width="6" opacity="0.92" marker-end="url(#arrow-gold)"/>

<line x1="905" y1="265" x2="945" y2="320" stroke="#3f76a3" stroke-width="6" opacity="0.95" marker-end="url(#arrow-blue)"/>
<line x1="905" y1="370" x2="945" y2="370" stroke="#3f76a3" stroke-width="6" opacity="0.95" marker-end="url(#arrow-blue)"/>
<line x1="910" y1="510" x2="945" y2="420" stroke="#3f76a3" stroke-width="6" opacity="0.95" marker-end="url(#arrow-blue)"/>

</svg>

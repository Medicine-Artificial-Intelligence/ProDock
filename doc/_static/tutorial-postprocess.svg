    .title{font:700 32px 'Inter','Segoe UI',Arial,sans-serif; fill:#1f3f59; letter-spacing:-0.2px}
    .subtitle{font:600 18px 'Inter','Segoe UI',Arial,sans-serif; fill:#4274a0}
    .label{font:700 17px 'Inter','Segoe UI',Arial,sans-serif; fill:#23445f}
    .body{font:400 14px 'Inter','Segoe UI',Arial,sans-serif; fill:#526b7d}
    .small{font:600 13px 'Inter','Segoe UI',Arial,sans-serif; fill:#526b7d}
    .tiny{font:600 11.5px 'Inter','Segoe UI',Arial,sans-serif; fill:#6a7e8c; letter-spacing:0.1px}

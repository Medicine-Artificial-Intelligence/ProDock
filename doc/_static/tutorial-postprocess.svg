<rect x="0" y="0" width="1220" height="660" rx="28" fill="url(#bggrad)"/>
<rect x="12" y="12" width="1196" height="636" rx="26" fill="#ffffff" stroke="#e3ebf1" stroke-width="1.5" filter="url(#softshadow)"/>

<text x="56" y="64" class="title">Postprocess poses and docking logs</text>
<text x="56" y="96" class="body">Parse logs, crawl pose trees, convert poses to molecules, compute interactions, and derive metrics.</text>


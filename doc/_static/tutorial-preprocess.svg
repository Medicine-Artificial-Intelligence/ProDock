  <polygon points="0,-4 65,-4 65,-12 85,0 65,12 65,4 0,4" fill="#3f76a3" opacity="0.95"/>
</g>
  
<polygon points="725.0,319.0 800.0,319.0 800.0,324.6 818.0,315.0 800.0,305.4 800.0,311.0 725.0,311.0" fill="#3f76a3" opacity="0.95"/>


<text x="145.0" y="314.0" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#23445f" text-anchor="middle">embed</text>

<rect x="208" y="295" width="110" height="28" rx="14.0" fill="#ffffff"/>
<text x="263.0" y="314.0" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#23445f" text-anchor="middle">optimize</text>

<rect x="90" y="475" width="120" height="28" rx="14.0" fill="#ffffff"/>
<text x="150.0" y="494.0" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#23445f" text-anchor="middle">meeko / obabel</text>

<rect x="458" y="410" width="110" height="28" rx="14.0" fill="#ffffff"/>
<text x="513.0" y="429.0" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#23445f" text-anchor="middle">center</text>

<rect x="575" y="410" width="90" height="28" rx="14.0" fill="#ffffff"/>
<text x="620.0" y="429.0" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#23445f" text-anchor="middle">size</text>

</svg>

  <path d="M 80,480 C 70,530 100,560 150,560 C 200,560 230,530 220,480 C 215,445 190,440 175,465 C 165,480 135,480 125,465 C 110,440 85,445 80,480 Z" fill="url(#bluegrad)" opacity="0.95" filter="url(#softshadow)"/>
  <path d="M 95,485 C 95,520 120,540 150,540 C 180,540 205,520 205,485 C 190,465 175,485 150,485 C 125,485 110,465 95,485 Z" fill="url(#navygrad)" opacity="0.9"/>
  <line x1="130" y1="495" x2="105" y2="475" stroke="#f0d05a" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  <line x1="170" y1="495" x2="195" y2="475" stroke="#f0d05a" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  <line x1="150" y1="530" x2="150" y2="550" stroke="#f0d05a" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  <polyline points="130,495 150,510 170,495" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="150" y1="510" x2="150" y2="530" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="150" cy="510" r="7.5" fill="#f4b93b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="130" cy="495" r="7.5" fill="#f24d3d" stroke="#ffffff" stroke-width="1.5"/>

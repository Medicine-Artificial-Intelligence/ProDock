<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">

<defs>
  <linearGradient id="bggrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#f0f5fa"/>
    <stop offset="100%" stop-color="#e0eef8"/>
  </linearGradient>

  <linearGradient id="navygrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#376789"/>
    <stop offset="100%" stop-color="#1f425f"/>
  </linearGradient>
  <linearGradient id="bluegrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#9cc6df"/>
    <stop offset="100%" stop-color="#4f87b0"/>
  </linearGradient>

  <linearGradient id="glassBox" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#eaf3f8" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="glassBoxAccent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f2fcf6" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#e0f5e8" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="glassBoxBlue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0f6fa" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#dcecf5" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="boxStroke" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#55c2ff" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#2a75b3" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="boxStrokeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38e68c" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#198a51" stop-opacity="0.2"/>
  </linearGradient>

  <linearGradient id="pillTop" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#e2eef7"/>
  </linearGradient>
  <linearGradient id="pillSide" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#92bcdc"/>
    <stop offset="100%" stop-color="#5a8bac"/>
  </linearGradient>

  <radialGradient id="sphereYellow" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#ffebb3"/>
    <stop offset="40%" stop-color="#f4b93b"/>
    <stop offset="85%" stop-color="#c98d06"/>
    <stop offset="100%" stop-color="#8a5f00"/>
  </radialGradient>
  <radialGradient id="sphereRed" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#ffc2b3"/>
    <stop offset="40%" stop-color="#f24d3d"/>
    <stop offset="85%" stop-color="#bd2111"/>
    <stop offset="100%" stop-color="#7a1005"/>
  </radialGradient>
  <radialGradient id="sphereBlue" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#d4f1fa"/>
    <stop offset="40%" stop-color="#57b8d9"/>
    <stop offset="85%" stop-color="#2a86a6"/>
    <stop offset="100%" stop-color="#14546b"/>
  </radialGradient>
  <radialGradient id="sphereOrange" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#ffd1c2"/>
    <stop offset="40%" stop-color="#ef6a48"/>
    <stop offset="85%" stop-color="#b83614"/>
    <stop offset="100%" stop-color="#751e08"/>
  </radialGradient>

  <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cddce8" stroke-width="0.8" opacity="0.6"/>
    <circle cx="0" cy="0" r="1.5" fill="#a9c2d6" opacity="0.5"/>
  </pattern>

  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4d6f8f" flood-opacity="0.15"/>
  </filter>
  <filter id="innershadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#afbfcc" flood-opacity="0.10"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowGreen">
    <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3a566e" flood-opacity="0.18"/>
  </filter>
  <filter id="atomShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="1.5" dy="4" stdDeviation="2.5" flood-color="#051421" flood-opacity="0.5"/>
  </filter>

  <style>
    .title{font:700 32px 'Inter','Segoe UI',Arial,sans-serif; fill:#112a40; letter-spacing:-0.2px}
    .label{font:800 17px 'Inter','Segoe UI',Arial,sans-serif; fill:#18364f}
    .body{font:400 14px 'Inter','Segoe UI',Arial,sans-serif; fill:#47657d}
    .small{font:600 13px 'Inter','Segoe UI',Arial,sans-serif; fill:#47657d}
    .tiny{font:600 11.5px 'Inter','Segoe UI',Arial,sans-serif; fill:#6a7e8c; letter-spacing:0.1px}
    .cyber-dot{fill:#ffc000}
  </style>
</defs>

<rect x="0" y="0" width="1200" height="660" rx="28" fill="url(#bggrad)"/>
<rect x="12" y="12" width="1176" height="636" rx="26" fill="#ffffff" filter="url(#softshadow)"/>
<rect x="12" y="12" width="1176" height="636" rx="26" fill="url(#cyberGrid)"/>
<rect x="12" y="12" width="1176" height="636" rx="26" fill="none" stroke="#e3ebf1" stroke-width="1.5" pointer-events="none"/>

<text x="60" y="72" class="title">Preprocess inputs for docking</text>
<g transform="translate(1034, 40)">
  <rect x="0" y="3" width="128" height="34" rx="17" fill="url(#pillSide)" filter="url(#innershadow)"/>
  <rect x="0" y="0" width="128" height="34" rx="17" fill="url(#pillTop)"/>
  <circle cx="18" cy="17" r="4.5" class="cyber-dot" filter="url(#glow)"/>
  <text x="73" y="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#315f86" text-anchor="middle">Preprocessing</text>
</g>
<text x="60" y="104" class="body">Prepare ligand conformers, convert receptor files, and compute a search box from a reference ligand or explicit coordinates.</text>

<g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 360 220 C 400 220, 400 280, 440 280" stroke="#00f0ff" filter="url(#glow)"/>
  <g transform="translate(440, 280)" stroke="#00f0ff" filter="url(#glow)">
    <path d="M -10 -6 L 0 0 L -10 6" />
  </g>
  
  <path d="M 360 400 C 400 400, 400 340, 440 340" stroke="#38e68c" filter="url(#glowGreen)"/>
  <g transform="translate(440, 340)" stroke="#38e68c" filter="url(#glowGreen)">
    <path d="M -10 -6 L 0 0 L -10 6" />
  </g>

  <path d="M 715 315 L 815 315" stroke="#00f0ff" filter="url(#glow)"/>
  <g transform="translate(765, 315)" stroke="#00f0ff" filter="url(#glow)">
    <path d="M 0 0 L 8 10 L 0 20" />
    <path d="M 6 0 L 14 10 L 6 20" />
  </g>
</g>

<g transform="translate(70, 160)">
  <rect x="0" y="6" width="290" height="120" rx="22" fill="#a4c2d6" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="290" height="120" rx="22" fill="url(#glassBox)" stroke="url(#boxStroke)" stroke-width="1.5"/>
  <text x="25" y="35" class="label">LigandPrep</text>
  <text x="25" y="65" class="body">SMILES / SDF → 3D conformer → PDBQT</text>
  <rect x="15" y="15" width="4" height="25" rx="2" fill="#00f0ff" filter="url(#glow)"/>
  
  <g transform="translate(15, 105)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#ffffff" stroke="#c9dceb" stroke-width="1.2"/>
    <!-- <circle cx="15" cy="13" r="4" fill="#0099ff" filter="url(#glow)"/> -->
    <path d="M 15,8 L 16,11 L 19,12 L 16,13 L 15,16 L 14,13 L 11,12 L 14,11 Z" fill="#0099ff" filter="url(#glow)"/>
    <text x="55" y="18" class="small" text-anchor="middle">embed</text>
  </g>
  <g transform="translate(130, 105)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#ffffff" stroke="#c9dceb" stroke-width="1.2"/>
    <circle cx="15" cy="13" r="4" fill="#0099ff" filter="url(#glow)"/>
    <text x="55" y="18" class="small" text-anchor="middle">optimize</text>
  </g>
</g>

<g transform="translate(70, 340)">
  <rect x="0" y="6" width="290" height="120" rx="22" fill="#8cbfa2" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="290" height="120" rx="22" fill="url(#glassBoxAccent)" stroke="url(#boxStrokeGreen)" stroke-width="1.5"/>
  <text x="25" y="35" class="label">ReceptorPrep</text>
  <text x="25" y="65" class="body">protein PDB → cleaned receptor → PDBQT</text>
  <rect x="15" y="15" width="4" height="25" rx="2" fill="#38e68c" filter="url(#glowGreen)"/>

  <g transform="translate(15, 105)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#ffffff" stroke="#c9dceb" stroke-width="1.2"/>
    <!-- <circle cx="15" cy="13" r="4" fill="#198a51" filter="url(#glowGreen)"/> -->
    <rect x="10" y="8" width="13" height="10" rx="2" fill="none" stroke="#198a51" stroke-width="1.5"/>
    <polyline points="12,11 14,13 12,15" fill="none" stroke="#198a51" stroke-width="1.5" filter="url(#glowGreen)"/>
    <line x1="15" y1="15" x2="19" y2="15" stroke="#198a51" stroke-width="1.5"/>
    <text x="75" y="18" class="small" text-anchor="middle">meeko / obabel</text>
  </g>
</g>

<g transform="translate(445, 250)">
  <rect x="0" y="6" width="275" height="130" rx="22" fill="#a4c2d6" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="275" height="130" rx="22" fill="url(#glassBoxBlue)" stroke="url(#boxStroke)" stroke-width="1.5"/>
  <text x="25" y="35" class="label">GridBox</text>
  <text x="25" y="65" class="body">reference ligand or explicit center / size</text>
  <rect x="15" y="15" width="4" height="25" rx="2" fill="#00f0ff" filter="url(#glow)"/>

    <g transform="translate(185, 65) scale(0.95)">
     <circle cx="30" cy="30" r="14" fill="#eaf3f8" stroke="#0099ff" stroke-width="1.5" stroke-dasharray="2,2"/>
     <circle cx="30" cy="30" r="3" fill="#0099ff" filter="url(#glow)"/>
     <rect x="10" y="10" width="40" height="40" fill="none" stroke="#a0bed6" stroke-width="2"/>
     <rect x="20" y="20" width="40" height="40" fill="none" stroke="#55c2ff" stroke-width="2" stroke-dasharray="4,2" filter="url(#glow)"/>
     <line x1="10" y1="10" x2="20" y2="20" stroke="#a0bed6" stroke-width="2"/>
     <line x1="50" y1="10" x2="60" y2="20" stroke="#a0bed6" stroke-width="2"/>
     <line x1="10" y1="50" x2="20" y2="60" stroke="#a0bed6" stroke-width="2"/>
     <line x1="50" y1="50" x2="60" y2="60" stroke="#a0bed6" stroke-width="2"/>
  </g>


  <g transform="translate(15, 115)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="90" height="26" rx="13" fill="#ffffff" stroke="#c9dceb" stroke-width="1.2"/>
    <circle cx="15" cy="13" r="4" fill="none" stroke="#0099ff" stroke-width="1.5"/>
    <circle cx="15" cy="13" r="1.5" fill="#0099ff" filter="url(#glow)"/>
    <text x="45" y="18" class="small" text-anchor="middle">center</text>
  </g>
  <g transform="translate(120, 115)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="80" height="26" rx="13" fill="#ffffff" stroke="#c9dceb" stroke-width="1.2"/>
    <path d="M 11,9 L 14,9 L 11,12 M 19,17 L 16,17 L 19,14" fill="none" stroke="#0099ff" stroke-width="1.5"/>
    <line x1="11" y1="9" x2="19" y2="17" stroke="#0099ff" stroke-width="1.5" filter="url(#glow)"/>
    <text x="40" y="18" class="small" text-anchor="middle">size</text>
  </g>
</g>

<g transform="translate(820, 250)">
  <rect x="0" y="6" width="260" height="130" rx="22" fill="#a4c2d6" filter="url(#softshadow)"/>
  <rect x="0" y="0" width="260" height="130" rx="22" fill="url(#glassBox)" stroke="url(#boxStroke)" stroke-width="1.5"/>
  <text x="25" y="35" class="label">Prepared inputs</text>
  <text x="25" y="65" class="body">receptor.pdbqt + ligand.pdbqt + box</text>
  <rect x="15" y="15" width="4" height="25" rx="2" fill="#00f0ff" filter="url(#glow)"/>
  
  <g transform="translate(200, 95) scale(1.3)">
      <!-- <rect x="-45" y="-30" width="90" height="60" rx="8" fill="#ffffff" stroke="#c9dceb" stroke-width="2" filter="url(#cardShadow)"/> -->
      <path d="M -15 -10 L 15 -10 L 15 15 L -15 15 Z" fill="#f0f6fa" stroke="#a0bed6" stroke-width="1.5" stroke-dasharray="2 2"/>
      <path d="M -15 -10 L -25 -5" fill="none" stroke="#a0bed6" stroke-width="1.5" stroke-dasharray="2 2"/>
      <path d="M 15 -10 L 25 -5" fill="none" stroke="#a0bed6" stroke-width="1.5" stroke-dasharray="2 2"/>
      <path d="M 15 15 L 25 20" fill="none" stroke="#a0bed6" stroke-width="1.5" stroke-dasharray="2 2"/>
      <path d="M -15 15 L -25 20" fill="none" stroke="#a0bed6" stroke-width="1.5" stroke-dasharray="2 2"/>
      <path d="M -25 -5 L 25 -5 L 25 20 L -25 20 Z" fill="none" stroke="#3f76a3" stroke-width="2"/>
      <line x1="-5" y1="0" x2="5" y2="8" stroke="#38e68c" stroke-width="3" filter="url(#glowGreen)"/>
      <circle cx="-5" cy="0" r="4" fill="#198a51"/>
      <circle cx="5" cy="8" r="4" fill="#38e68c" filter="url(#glowGreen)"/>
  </g>
</g>

<g transform="translate(800, -20)">
  <path d="M 80,480 C 70,530 100,560 150,560 C 200,560 230,530 220,480 C 215,445 190,440 175,465 C 165,480 135,480 125,465 C 110,440 85,445 80,480 Z" fill="url(#bluegrad)" opacity="0.95" filter="url(#softshadow)"/>
  <path d="M 88,483 C 80,525 108,550 150,550 C 192,550 220,525 212,483 C 205,450 185,448 170,470 C 160,485 140,485 130,470 C 115,448 95,450 88,483 Z" fill="#4a7c9f" opacity="0.8"/>
  <path d="M 95,485 C 95,520 120,540 150,540 C 180,540 205,520 205,485 C 190,465 175,485 150,485 C 125,485 110,465 95,485 Z" fill="url(#navygrad)" opacity="1"/>
  
  <line x1="130" y1="495" x2="105" y2="475" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="170" y1="495" x2="195" y2="475" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="150" y1="530" x2="150" y2="550" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round" filter="url(#glow)"/>
  
  <line x1="150" y1="510" x2="130" y2="495" stroke="#5a6b7a" stroke-width="7" stroke-linecap="round"/>
  <line x1="150" y1="510" x2="130" y2="495" stroke="#cbd6e0" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="150" y1="510" x2="170" y2="495" stroke="#5a6b7a" stroke-width="7" stroke-linecap="round"/>
  <line x1="150" y1="510" x2="170" y2="495" stroke="#cbd6e0" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="150" y1="510" x2="150" y2="530" stroke="#5a6b7a" stroke-width="7" stroke-linecap="round"/>
  <line x1="150" y1="510" x2="150" y2="530" stroke="#cbd6e0" stroke-width="3.5" stroke-linecap="round"/>
  
  <circle cx="130" cy="495" r="9.5" fill="url(#sphereRed)" filter="url(#atomShadow)"/>
  <circle cx="170" cy="495" r="9.5" fill="url(#sphereBlue)" filter="url(#atomShadow)"/>
  <circle cx="150" cy="530" r="9.5" fill="url(#sphereOrange)" filter="url(#atomShadow)"/>
  <circle cx="150" cy="510" r="11" fill="url(#sphereYellow)" filter="url(#atomShadow)"/>

  <g transform="translate(70, 580)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#ffffff" stroke="#c9dceb" stroke-width="1.2"/>
    <text x="80" y="18" class="small" text-anchor="middle">reference ligand driven</text>
  </g>
</g>

</svg>

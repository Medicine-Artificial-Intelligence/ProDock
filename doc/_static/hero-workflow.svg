<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">

<defs>
  <linearGradient id="bggrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#f0f5fa"/>
    <stop offset="100%" stop-color="#e0eef8"/>
  </linearGradient>

    <linearGradient id="bluegrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#9cc6df"/>
    <stop offset="100%" stop-color="#4f87b0"/>
  </linearGradient>
    <linearGradient id="navygrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#376789"/>
    <stop offset="100%" stop-color="#1f425f"/>
  </linearGradient>
  
  <linearGradient id="glassBox" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#eaf3f8" stop-opacity="0.85"/>
  </linearGradient>

  <linearGradient id="glassBoxAccent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f2fcf6" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#e0f5e8" stop-opacity="0.85"/>
  </linearGradient>

    <linearGradient id="dbBodyGrad" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0%" stop-color="#1c4463"/>
    <stop offset="30%" stop-color="#3571a5"/>
    <stop offset="70%" stop-color="#3571a5"/>
    <stop offset="100%" stop-color="#143147"/>
  </linearGradient>

    <linearGradient id="dbTopGrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#6baae0"/>
    <stop offset="100%" stop-color="#2c608c"/>
  </linearGradient>

  <linearGradient id="boxStroke" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#55c2ff" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#2a75b3" stop-opacity="0.2"/>
  </linearGradient>

    <radialGradient id="sphereYellow" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#ffebb3"/>
    <stop offset="40%" stop-color="#f4b93b"/>
    <stop offset="85%" stop-color="#c98d06"/>
    <stop offset="100%" stop-color="#8a5f00"/>
  </radialGradient>
  <radialGradient id="sphereRed" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#ffc2b3"/>
    <stop offset="40%" stop-color="#f24d3d"/>
    <stop offset="85%" stop-color="#bd2111"/>
    <stop offset="100%" stop-color="#7a1005"/>
  </radialGradient>
  <radialGradient id="sphereBlue" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#d4f1fa"/>
    <stop offset="40%" stop-color="#57b8d9"/>
    <stop offset="85%" stop-color="#2a86a6"/>
    <stop offset="100%" stop-color="#14546b"/>
  </radialGradient>
  <radialGradient id="sphereOrange" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#ffd1c2"/>
    <stop offset="40%" stop-color="#ef6a48"/>
    <stop offset="85%" stop-color="#b83614"/>
    <stop offset="100%" stop-color="#751e08"/>
  </radialGradient>

  <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cddce8" stroke-width="0.8" opacity="0.5"/>
    <circle cx="0" cy="0" r="1.5" fill="#a9c2d6" opacity="0.4"/>
  </pattern>

  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4d6f8f" flood-opacity="0.15"/>
  </filter>

  <filter id="blocky3D" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="-2.5" dy="3.5" stdDeviation="0" flood-color="#1a364f" flood-opacity="0.4"/>
    <feDropShadow dx="-1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2"/>
  </filter>
  
  <filter id="glow">
    <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
    <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>
    .title{font:700 32px 'Inter','Segoe UI',Arial,sans-serif; fill:#112a40; letter-spacing:-0.2px}
    .label{font:800 17px 'Inter','Segoe UI',Arial,sans-serif; fill:#18364f}
    .body{font:400 14px 'Inter','Segoe UI',Arial,sans-serif; fill:#47657d}
    .small{font:600 13px 'Inter','Segoe UI',Arial,sans-serif; fill:#47657d}
    .tiny{font:600 11.5px 'Inter','Segoe UI',Arial,sans-serif; fill:#6a7e8c}
    .neon-text{fill:#0099ff}
    .cyber-dot{fill:#ff0f00}
  </style>
</defs>

<rect x="0" y="0" width="1200" height="650" rx="28" fill="url(#bggrad)"/>
<rect x="12" y="12" width="1176" height="626" rx="26" fill="#ffffff" filter="url(#softshadow)"/>
<rect x="12" y="12" width="1176" height="626" rx="26" fill="url(#cyberGrid)"/>

<text x="60" y="72" class="title">Workflow-first docking automation</text>
<g transform="translate(1034, 40)">
  <rect x="0" y="0" width="118" height="34" rx="17" fill="#ffffff" stroke="#d6e0e8" stroke-width="1.2"/>
  <circle cx="18" cy="17" r="4" class="cyber-dot" filter="url(#glow)"/>
  <text x="66" y="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#315f86" text-anchor="middle">Workflow</text>
</g>
<text x="60" y="106" class="body">Structure → Preprocess → Dock → Postprocess → Database</text>

<g transform="translate(60, 130)">
  <rect x="0" y="0" width="140" height="28" rx="14" fill="#f1f7f0" stroke="#d5e6d2" stroke-width="1"/>

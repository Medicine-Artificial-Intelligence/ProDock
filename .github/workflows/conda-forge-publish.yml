name: Publish to Anaconda (conda)

on:
  release:
    types: [published]
  push:
    branches: [conda, refactor]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-64
          - runner: windows-latest
            label: win-64
          - runner: macos-15-intel
            label: osx-64
          # Add this too if you also want Apple Silicon:
          # - runner: macos-latest
          #   label: osx-arm64

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-update-conda: true
          activate-environment: build
          python-version: "3.11"
          channels: conda-forge

      - name: Install build tools
        run: |
          conda install -n build -y -c conda-forge "conda-build>=3.21" anaconda-client
          conda info
          conda info --envs

      - name: Build conda package(s)
        run: |
          rm -rf conda-bld || true
          mkdir -p conda-bld

          if [ -d recipe ]; then
            conda-build recipe --output-folder ./conda-bld
          else
            conda-build . --output-folder ./conda-bld
          fi

          echo "Built files:"
          find conda-bld -type f \( -name "*.conda" -o -name "*.tar.bz2" \) -print

      - name: Upload built packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-packages-${{ matrix.label }}
          path: conda-bld/

  publish_release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          pattern: conda-packages-*
          path: conda-bld
          merge-multiple: true

      - name: Install/upgrade Anaconda client
        run: python3 -m pip install --upgrade anaconda-client

      - name: Upload packages to Anaconda.org (main)
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANACONDA_TOKEN:-}" ]; then
            echo "ANACONDA_TOKEN is not set"
            exit 1
          fi

          find conda-bld -type f \( -name "*.conda" -o -name "*.tar.bz2" \) -print0 | \
            while IFS= read -r -d '' pkg; do
              echo "Uploading: $pkg"
              anaconda -t "${ANACONDA_TOKEN}" upload \
                --user tieulongphan \
                --label main \
                --no-progress \
                "$pkg"
            done

  publish_beta:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          pattern: conda-packages-*
          path: conda-bld
          merge-multiple: true

      - name: Install/upgrade Anaconda client
        run: python3 -m pip install --upgrade anaconda-client

      - name: Upload packages to Anaconda.org (beta)
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANACONDA_TOKEN:-}" ]; then
            echo "ANACONDA_TOKEN is not set"
            exit 1
          fi

          find conda-bld -type f \( -name "*.conda" -o -name "*.tar.bz2" \) -print0 | \
            while IFS= read -r -d '' pkg; do
              echo "Uploading: $pkg"
              anaconda -t "${ANACONDA_TOKEN}" upload \
                --user tieulongphan \
                --label beta \
                --no-progress \
                "$pkg"
            done
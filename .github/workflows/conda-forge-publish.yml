name: Publish to Anaconda (conda-forge)

on:
  release:
    types: [published]
  push:
    branches: [conda, refactor, release]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-64
            runner: ubuntu-latest
          - label: osx-64
            runner: macos-13
          - label: osx-arm64
            runner: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: true
          auto-activate-base: true

      - name: Create build environment
        shell: bash -l {0}
        run: |
          conda create -n build -y -c conda-forge python=3.11 "conda-build>=3.21" anaconda-client
          conda activate build
          conda info --envs

      - name: Build conda package
        shell: bash -l {0}
        run: |
          conda activate build
          rm -rf conda-bld || true
          mkdir -p conda-bld

          if [ -d recipe ]; then
            conda-build recipe --output-folder ./conda-bld --no-anaconda-upload
          else
            conda-build . --output-folder ./conda-bld --no-anaconda-upload
          fi

          echo "Built files:"
          find conda-bld -type f \( -name "*.conda" -o -name "*.tar.bz2" \) -print

      - name: Upload built packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-packages-${{ matrix.label }}
          path: conda-bld/
          if-no-files-found: error

  publish_release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: conda-packages-*
          path: conda-bld
          merge-multiple: true

      - name: Install/upgrade Anaconda client
        run: python3 -m pip install --upgrade anaconda-client

      - name: Upload packages to Anaconda.org (main)
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANACONDA_TOKEN:-}" ]; then
            echo "ANACONDA_TOKEN is not set"
            exit 1
          fi

          find conda-bld -type f \( -name "*.conda" -o -name "*.tar.bz2" \) -print0 | \
            while IFS= read -r -d '' pkg; do
              echo "Uploading: $pkg"
              anaconda -t "${ANACONDA_TOKEN}" upload \
                --user tieulongphan \
                --label main \
                --no-progress \
                "$pkg"
            done

  publish_beta:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/refactor'
    runs-on: ubuntu-latest

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: conda-packages-*
          path: conda-bld
          merge-multiple: true

      - name: Install/upgrade Anaconda client
        run: python3 -m pip install --upgrade anaconda-client

      - name: Upload packages to Anaconda.org (beta)
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANACONDA_TOKEN:-}" ]; then
            echo "ANACONDA_TOKEN is not set"
            exit 1
          fi

          find conda-bld -type f \( -name "*.conda" -o -name "*.tar.bz2" \) -print0 | \
            while IFS= read -r -d '' pkg; do
              echo "Uploading: $pkg"
              anaconda -t "${ANACONDA_TOKEN}" upload \
                --user tieulongphan \
                --label beta \
                --no-progress \
                "$pkg"
            done
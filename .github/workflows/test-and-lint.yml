name: Test & Lint

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CONDA_ENV_NAME: prodock-env
  PYTHON_VERSION: "3.11"
  OPENMM_PACKAGE: "openmm=8.3.1"
  PDBFIXER_PACKAGE: "pdbfixer"
  VINA_PACKAGE: "vina"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            runner: ubuntu-latest
          - name: macOS Intel
            runner: macos-15-intel
          - name: macOS Apple Silicon
            runner: macos-14

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml', 'setup.cfg', 'setup.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          python-version: ${{ env.PYTHON_VERSION }}
          auto-activate: true
          channels: conda-forge
          channel-priority: strict
          show-channel-urls: true

      - name: Show runner and conda info
        run: |
          echo "Runner: ${{ matrix.name }}"
          echo "OS: $RUNNER_OS"
          python -V
          conda info
          conda config --show channels

      - name: Install conda-managed binary dependencies
        run: |
          PKGS=(
            "$OPENMM_PACKAGE"
            "$PDBFIXER_PACKAGE"
            "$VINA_PACKAGE"
          )

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            PKGS+=("pymol-open-source")
          fi

          conda install -y -c conda-forge "${PKGS[@]}"

      - name: Build filtered pip requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              grep -vE '^(openmm|pdbfixer|vina|pymol_open_source|OpenMM|PDBFixer|Vina)([[:space:]]|[<>=!~].*)?$' requirements.txt > reqs-pip.txt || true
            else
              grep -vE '^(openmm|pdbfixer|vina|OpenMM|PDBFixer|Vina)([[:space:]]|[<>=!~].*)?$' requirements.txt > reqs-pip.txt || true
            fi

            echo "Filtered requirements:"
            cat reqs-pip.txt || true
          else
            echo "No requirements.txt found."
            : > reqs-pip.txt
          fi

      - name: Install Python dependencies and package
        run: |
          if [ -s reqs-pip.txt ]; then
            python -m pip install -r reqs-pip.txt
          else
            echo "No pip requirements left after filtering."
          fi

          python -m pip install -e . --no-deps

      - name: Install test/dev dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install pytest flake8
          fi

      - name: Lint
        run: |
          if [ -f ./lint.sh ]; then
            bash ./lint.sh
          else
            python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          fi

      - name: Run tests
        run: |
          if [ -f ./pytest.sh ]; then
            bash ./pytest.sh
          else
            python -m pytest -q
          fi

      - name: Print environment summary
        if: always()
        run: |
          echo "Runner: ${{ matrix.name }}"
          echo "OS: $RUNNER_OS"
          python -V
          which python || true
          python -m pip show pymol-open-source || true
          conda list || true
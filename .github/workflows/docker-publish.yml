name: Publish Docker

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push beta image from refactor
        if: github.ref == 'refs/heads/refactor'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            tieulongphan/prodock:beta
            tieulongphan/prodock:refactor

      - name: Build and push release image from release branch
        if: github.ref == 'refs/heads/release'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            tieulongphan/prodock:release
            tieulongphan/prodock:latest

      - name: Build and push versioned image from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            tieulongphan/prodock:${{ github.ref_name }}
            tieulongphan/prodock:latest